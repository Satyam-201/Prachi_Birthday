<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Movie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Cinzel+Decorative:wght@400;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: hidden; height: 100vh; }

  .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  #sceneRoot { position: absolute; inset: 0; z-index: 1; }
  /* (Ken Burns crop-zoom classes were removed — photos now display uncropped) */

  .scene {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 1s var(--ease);
    text-align: center;
    padding: 2rem;
  }
  .scene.active { opacity: 1; pointer-events: auto; }

  /* ---------- top bar ---------- */
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 1.4rem; }
  .topbar a.home { font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cream-dim); text-decoration: none; opacity: 0.75; }
  .sound-toggle { background: none; border: 1px solid rgba(201,162,76,0.4); color: var(--gold-light); border-radius: 999px; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }

  /* ---------- overall progress bar ---------- */
  .overall-progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 31; background: rgba(255,255,255,0.08); }
  .overall-progress .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); transition: width 0.4s var(--ease-soft); }

  /* ---------- nav arrows ---------- */
  .nav-btn { position: fixed; top: 50%; transform: translateY(-50%); z-index: 30; background: rgba(21,13,26,0.4); border: 1px solid rgba(201,162,76,0.3); color: var(--gold-light); width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; }
  .nav-prev { left: 1rem; } .nav-next { right: 1rem; }

  /* ---------- start overlay ---------- */
  .start-overlay { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.8rem; text-align: center; padding: 2rem; }
  .start-overlay.hide { display: none; }
  .movie-title { font-family: var(--font-royal); font-size: clamp(1.6rem, 6vw, 2.8rem); color: var(--gold-light); letter-spacing: 0.03em; line-height: 1.3; }
  .movie-sub { font-family: var(--font-display); font-style: italic; font-size: clamp(1.1rem, 3vw, 1.4rem); color: var(--cream-dim); }
  .movie-credits { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream-dim); opacity: 0.7; line-height: 2; }

  /* ---------- photo scene ---------- */
  .photo-scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.4rem;
    padding: 6.4rem 1.4rem 2.2rem;
  }

  /* Blurred, darkened duplicate of the same photo fills the frame edge-to-edge
     so nothing ever looks empty, while the real photo (below) stays fully
     visible and uncropped on top of it. */
  .photo-backdrop {
    position: absolute; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
    filter: blur(38px) brightness(0.45) saturate(1.1);
    transform: scale(1.15);
  }
  .photo-backdrop::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(21,13,26,0.55) 0%, rgba(21,13,26,0.25) 30%, rgba(21,13,26,0.75) 100%);
  }

  .photo-frame {
    position: relative; z-index: 1;
    max-width: 92vw;
    max-height: 58vh;
    display: flex;
    box-shadow: 0 30px 60px rgba(0,0,0,0.55);
    border-radius: 8px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(14px) scale(0.98);
    transition: opacity 1s var(--ease), transform 1s var(--ease);
  }
  .scene.active .photo-frame { opacity: 1; transform: translateY(0) scale(1); }
  .photo-frame img {
    display: block;
    max-width: 92vw;
    max-height: 58vh;
    width: auto; height: auto;
    object-fit: contain;
  }

  .chapter-tag {
    position: absolute; top: 5.4rem; left: 50%; transform: translateX(-50%);
    z-index: 2;
    font-family: var(--font-body); letter-spacing: 0.35em; text-transform: uppercase;
    font-size: 0.68rem; color: var(--gold-light);
    background: rgba(21,13,26,0.45); border: 1px solid rgba(201,162,76,0.35);
    padding: 0.5em 1.2em; border-radius: 999px; backdrop-filter: blur(4px);
    opacity: 0; animation: tagFade 1s var(--ease) 0.3s forwards;
  }
  @keyframes tagFade { to { opacity: 1; } }

  .photo-caption {
    position: relative; z-index: 1;
    max-width: 560px;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.05rem, 3.4vw, 1.5rem);
    line-height: 1.5;
    color: var(--cream);
    text-shadow: 0 3px 16px rgba(0,0,0,0.6);
  }
  .cap-word {
    display: inline-block;
    opacity: 0;
    transform: translateY(14px);
    animation: capIn 0.7s var(--ease) forwards;
  }
  @keyframes capIn { to { opacity: 1; transform: translateY(0); } }

  @media (max-height: 640px) {
    .photo-scene { padding-top: 5.2rem; gap: 0.9rem; }
    .photo-frame, .photo-frame img { max-height: 46vh; }
    .photo-caption { font-size: 0.95rem; }
  }

  /* ---------- placeholder (missing photo) scene ---------- */
  .placeholder-card {
    max-width: 420px; padding: 3rem 2rem; border-radius: 12px;
    background: linear-gradient(160deg, var(--surface-soft), var(--surface));
    border: 1px solid rgba(201,162,76,0.3);
  }
  .placeholder-card .glyph { font-size: 2rem; color: var(--gold-light); margin-bottom: 1rem; }
  .placeholder-card h3 { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 1.5rem; margin: 0 0 0.6rem; }
  .placeholder-card p { color: var(--cream-dim); font-size: 0.85rem; margin: 0; }

  /* ---------- timeline scene ---------- */
  .timeline-wrap { max-width: 620px; width: 100%; }
  .timeline-wrap h2 { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: clamp(1.6rem, 4.5vw, 2.2rem); margin: 0 0 2rem; color: var(--gold-light); }
  .tl-events { display: flex; flex-direction: column; gap: 1.1rem; text-align: left; }
  .tl-event { display: flex; gap: 1rem; align-items: flex-start; opacity: 0; transform: translateY(10px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
  .tl-event.show { opacity: 1; transform: translateY(0); }
  .tl-date { flex: 0 0 auto; font-family: var(--font-display); font-style: italic; color: var(--gold); font-size: 1rem; min-width: 72px; }
  .tl-text { font-size: 0.92rem; color: var(--cream-dim); line-height: 1.5; }

  /* ---------- reasons scene ---------- */
  .reasons-wrap { max-width: 520px; }
  .reasons-wrap .glyph { font-size: 1.6rem; color: var(--blush); margin-bottom: 1.2rem; }
  .reasons-wrap h2 { font-family: var(--font-display); font-style: italic; font-size: 1.3rem; color: var(--cream-dim); margin: 0 0 1.6rem; }
  .reason-text { font-family: var(--font-display); font-size: clamp(1.3rem, 4vw, 1.8rem); line-height: 1.5; min-height: 4.5em; display: flex; align-items: center; justify-content: center; }
  .reason-counter { margin-top: 1.4rem; font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }

  /* ---------- quiz scene ---------- */
  .quiz-wrap { max-width: 480px; width: 100%; }
  .quiz-wrap h2 { font-family: var(--font-display); font-style: italic; font-size: 1.5rem; margin: 0 0 1.6rem; }
  .quiz-options { display: flex; flex-direction: column; gap: 0.7rem; }
  .quiz-opt { font-family: var(--font-body); font-size: 0.9rem; background: var(--surface); border: 1px solid rgba(201,162,76,0.3); color: var(--cream); padding: 0.8em 1.2em; border-radius: 10px; cursor: pointer; text-align: left; transition: background 0.3s, border-color 0.3s; }
  .quiz-opt:hover { border-color: var(--gold); }
  .quiz-opt.correct { background: rgba(122, 176, 122, 0.25); border-color: #7ab07a; }
  .quiz-opt.wrong { background: rgba(176,90,90,0.25); border-color: #b05a5a; }
  .quiz-feedback { margin-top: 1rem; font-size: 0.85rem; color: var(--gold-light); min-height: 1.2em; }
  .quiz-result h2 { color: var(--gold-light); }

  /* ---------- finale scene ---------- */
  .finale-wrap { max-width: 480px; }
  .candle { width: 60px; margin: 0 auto 1.6rem; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .flame { width: 14px; height: 22px; background: radial-gradient(circle, #ffe08a, #ff8a3d 70%); border-radius: 50% 50% 50% 50%/60% 60% 40% 40%; margin: 0 auto; animation: flicker 1.4s ease-in-out infinite; transform-origin: bottom center; }
  @keyframes flicker { 0%,100% { transform: scaleY(1) rotate(-1deg); } 50% { transform: scaleY(1.12) rotate(1deg); } }
  .flame.out { display: none; }
  .candle-body { width: 22px; height: 60px; margin: 0 auto; background: linear-gradient(180deg, var(--blush), var(--wine-bright)); border-radius: 3px; }
  .finale-wrap h2 { font-family: var(--font-display); font-style: italic; font-size: clamp(1.5rem, 5vw, 2.1rem); color: var(--gold-light); margin: 0 0 0.8rem; }
  .finale-wrap p { color: var(--cream-dim); font-size: 0.9rem; margin: 0 0 2rem; }
  .finale-msg { display: none; }
  .finale-msg.show { display: block; animation: revealUp 0.9s var(--ease) forwards; }
  @keyframes revealUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .confetti-piece { position: fixed; top: -5vh; z-index: 60; pointer-events: none; }

  @media (max-width: 480px) {
    .chapter-tag { top: 4.6rem; font-size: 0.6rem; }
  }
</style>
</head>
<body>
<div class="stars"></div>

<div class="start-overlay" id="startOverlay">
  <div class="eyebrow">a film about us</div>
  <div class="movie-title">Prachi &amp; Keshav</div>
  <div class="movie-sub">a story, still being written</div>
  <div class="movie-credits">starring&nbsp; Prachi &middot; Keshav<br>directed by&nbsp; Guru's love for her</div>
  <button class="btn" id="startBtn">Press Play</button>
</div>

<div class="topbar">
  <a href="index.html" class="home">&larr; back</a>
  <button class="sound-toggle" id="soundToggle" aria-label="Mute or unmute">&#9834;</button>
</div>
<div class="overall-progress"><div class="fill" id="overallFill"></div></div>

<div class="stage" id="stage">
  <div id="sceneRoot"></div>
  <button class="nav-btn nav-prev" id="prevBtn" aria-label="Previous">&#10094;</button>
  <button class="nav-btn nav-next" id="nextBtn" aria-label="Next">&#10095;</button>
</div>

<audio id="song" preload="auto"></audio>

<script src="movie-data.js"></script>
<script src="movie.js"></script>
</body>
</html>
