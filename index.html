<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Prachi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Cinzel+Decorative:wght@400;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .gate {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
  }

  .gate h1 {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.1rem, 6vw, 3.4rem);
    margin: 0 0 0.6rem;
    color: var(--cream);
  }
  .gate .sub {
    color: var(--cream-dim);
    font-size: 0.95rem;
    margin-bottom: 2.4rem;
  }

  /* Countdown mode */
  .countdown-ring {
    display: flex;
    gap: 1.2rem;
    margin-bottom: 2.2rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .ring-unit {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: 1px solid rgba(201,162,76,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--surface-soft), var(--surface));
  }
  .ring-unit .num { font-family: var(--font-display); font-size: 1.6rem; color: var(--gold-light); line-height: 1; }
  .ring-unit .lbl { font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream-dim); margin-top: 4px; }

  .early-link {
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cream-dim);
    text-decoration: underline;
    text-underline-offset: 4px;
    background: none;
    border: none;
    cursor: pointer;
    opacity: 0.75;
    margin-top: 1.6rem;
  }
  .early-link:hover { opacity: 1; }

  /* Envelope */
  .envelope-wrap { perspective: 1400px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .envelope { width: min(78vw, 320px); aspect-ratio: 3/2; position: relative; filter: drop-shadow(0 25px 45px rgba(0,0,0,0.55)); }
  .env-body { position: absolute; inset: 0; background: linear-gradient(160deg, var(--surface-soft), var(--surface)); border: 1px solid rgba(201,162,76,0.35); border-radius: 6px; }
  .env-body::before, .env-body::after { content: ""; position: absolute; bottom: 0; width: 52%; height: 100%; background: linear-gradient(135deg, var(--surface), var(--surface-soft)); border: 1px solid rgba(201,162,76,0.2); }
  .env-body::before { left: 0; clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .env-body::after { right: 0; clip-path: polygon(100% 0, 0 50%, 100% 100%); }
  .env-flap { position: absolute; top: 0; left: 0; right: 0; height: 62%; background: linear-gradient(200deg, var(--wine-bright), var(--wine)); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top center; transition: transform 1.1s var(--ease); z-index: 3; border-top-left-radius: 6px; border-top-right-radius: 6px; }
  .envelope.open .env-flap { transform: rotateX(180deg); }
  .seal { position: absolute; top: 40%; left: 50%; width: 58px; height: 58px; transform: translate(-50%, -50%); background: radial-gradient(circle at 35% 30%, var(--wine-bright), var(--wine) 70%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-style: italic; font-size: 1.5rem; color: var(--gold-light); box-shadow: 0 4px 10px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(201,162,76,0.5); z-index: 5; transition: transform 0.5s var(--ease), opacity 0.5s var(--ease); }
  .envelope.open .seal { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  .letter-peek { position: absolute; left: 6%; right: 6%; bottom: 6%; top: 18%; background: linear-gradient(180deg, var(--cream), #efe0c8); border-radius: 4px; z-index: 2; transform: translateY(6%); transition: transform 1s var(--ease) 0.15s; box-shadow: 0 -6px 18px rgba(0,0,0,0.25); }
  .envelope.open .letter-peek { transform: translateY(-38%); }
  .hint { margin-top: 2.2rem; font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--cream-dim); opacity: 0.8; }

  .reveal { display: none; flex-direction: column; align-items: center; gap: 1.4rem; }
  .reveal.show { display: flex; animation: revealIn 0.9s var(--ease) forwards; }
  @keyframes revealIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

  #countdownMode, #envelopeMode { display: none; }
  #countdownMode.active, #envelopeMode.active { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
<div class="stars"></div>

<div class="gate">
  <div class="eyebrow" id="preLabel">for prachi</div>
  <h1 id="titleLine">something is waiting<br>for your birthday</h1>
  <div class="sub" id="subLine"></div>

  <div id="countdownMode">
    <div class="countdown-ring" id="countdownRing"></div>
    <button class="early-link" id="earlyBtn">can't wait? open it early &rarr;</button>
  </div>

  <div id="envelopeMode">
    <div class="envelope-wrap" id="envelopeWrap" role="button" tabindex="0" aria-label="Open the envelope">
      <div class="envelope" id="envelope">
        <div class="letter-peek"></div>
        <div class="env-body"></div>
        <div class="env-flap"></div>
        <div class="seal">&hearts;</div>
      </div>
    </div>
    <div class="hint" id="hintText">click the seal</div>

    <div class="reveal" id="revealPanel">
      <div class="eyebrow">happy birthday, my love</div>
      <a class="btn" href="movie.html">Begin</a>
    </div>
  </div>
</div>

<script>
  // ---- Countdown vs. envelope mode ----
  const BIRTHDAY_MONTH = 8; // August
  const BIRTHDAY_DAY = 18;

  function nextBirthday() {
    const now = new Date();
    let target = new Date(now.getFullYear(), BIRTHDAY_MONTH - 1, BIRTHDAY_DAY, 0, 0, 0);
    if (now > new Date(now.getFullYear(), BIRTHDAY_MONTH - 1, BIRTHDAY_DAY, 23, 59, 59)) {
      target = new Date(now.getFullYear() + 1, BIRTHDAY_MONTH - 1, BIRTHDAY_DAY, 0, 0, 0);
    }
    return target;
  }

  const countdownMode = document.getElementById('countdownMode');
  const envelopeMode = document.getElementById('envelopeMode');
  const subLine = document.getElementById('subLine');
  const ring = document.getElementById('countdownRing');

  let isCountdown = new Date() < nextBirthday() &&
    !(new Date().getMonth() === BIRTHDAY_MONTH - 1 && new Date().getDate() === BIRTHDAY_DAY);

  function renderCountdown() {
    const diff = nextBirthday() - new Date();
    if (diff <= 0) { showEnvelope(); return; }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    ring.innerHTML = `
      <div class="ring-unit"><div class="num">${d}</div><div class="lbl">days</div></div>
      <div class="ring-unit"><div class="num">${h}</div><div class="lbl">hrs</div></div>
      <div class="ring-unit"><div class="num">${m}</div><div class="lbl">min</div></div>
      <div class="ring-unit"><div class="num">${s}</div><div class="lbl">sec</div></div>
    `;
  }

  function showEnvelope() {
    isCountdown = false;
    countdownMode.classList.remove('active');
    envelopeMode.classList.add('active');
    subLine.textContent = "your day has come. tap below.";
  }

  function showCountdown() {
    countdownMode.classList.add('active');
    envelopeMode.classList.remove('active');
    subLine.textContent = "a little something is being saved for the exact right moment.";
    renderCountdown();
    setInterval(renderCountdown, 1000);
  }

  document.getElementById('earlyBtn').addEventListener('click', showEnvelope);

  if (isCountdown) { showCountdown(); } else { showEnvelope(); }

  // ---- Envelope open interaction ----
  const wrap = document.getElementById('envelopeWrap');
  const envelope = document.getElementById('envelope');
  const reveal = document.getElementById('revealPanel');
  const hint = document.getElementById('hintText');

  function openEnvelope() {
    if (envelope.classList.contains('open')) return;
    envelope.classList.add('open');
    hint.style.opacity = '0';
    burstHearts();
    setTimeout(() => reveal.classList.add('show'), 650);
  }
  wrap.addEventListener('click', openEnvelope);
  wrap.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); } });

  function burstHearts() {
    const symbols = ['&#10084;', '&#10022;', '&#9825;'];
    for (let i = 0; i < 18; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'heart-float';
        h.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
        h.style.left = (35 + Math.random() * 30) + 'vw';
        h.style.setProperty('--drift', (Math.random() * 140 - 70) + 'px');
        h.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
        h.style.animationDuration = (3.5 + Math.random() * 2.5) + 's';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 6500);
      }, i * 80);
    }
  }
</script>
</body>
</html>
